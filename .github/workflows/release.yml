name: Release FlashLAN

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RELEASE_BODY: |
    FlashLAN desktop, Android and iOS release.
    iOS is uploaded to TestFlight when the repository's iOS release credentials are enabled.

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: FlashLAN v__VERSION__
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles dmg
          releaseAssetNamePattern: FlashLAN-[platform]-[arch][ext]

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: FlashLAN v__VERSION__
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc --bundles nsis,msi
          releaseAssetNamePattern: FlashLAN-windows-[arch][ext]

  android:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Check Android project
        run: test -f src-tauri/gen/android/app/build.gradle.kts

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.3.11579264"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          yes | "$sdkmanager" --licenses >/dev/null || true

      - name: Configure Android signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$ANDROID_KEY_BASE64" || { echo "Missing ANDROID_KEY_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/flashlan-release.jks"
          {
            printf 'password=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "$RUNNER_TEMP/flashlan-release.jks"
          } > src-tauri/gen/android/keystore.properties

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mobile: android
          tagName: v__VERSION__
          releaseName: FlashLAN v__VERSION__
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          args: --apk
          releaseAssetNamePattern: FlashLAN-android-[arch][ext]

  ios:
    if: ${{ vars.IOS_RELEASE_ENABLED == 'true' }}
    runs-on: macos-latest
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Install iOS build tools
        run: brew install cocoapods xcodegen libimobiledevice

      - name: Validate iOS release credentials
        shell: bash
        run: |
          test -n "$APPLE_DEVELOPMENT_TEAM" || { echo "Missing APPLE_DEVELOPMENT_TEAM secret"; exit 1; }
          test -n "$APPLE_API_ISSUER" || { echo "Missing APPLE_API_ISSUER secret"; exit 1; }
          test -n "$APPLE_API_KEY" || { echo "Missing APPLE_API_KEY secret"; exit 1; }
          test -n "$APPLE_API_KEY_BASE64" || { echo "Missing APPLE_API_KEY_BASE64 secret"; exit 1; }

      - name: Configure App Store Connect API key
        shell: bash
        run: |
          key_dir="$HOME/.appstoreconnect/private_keys"
          key_path="$key_dir/AuthKey_${APPLE_API_KEY}.p8"
          mkdir -p "$key_dir"
          printf '%s' "$APPLE_API_KEY_BASE64" | openssl base64 -d -A > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Initialize iOS project
        run: pnpm tauri ios init --ci --skip-targets-install

      - name: Build signed iOS IPA
        run: pnpm tauri ios build --ci --build-number "$GITHUB_RUN_NUMBER" --export-method app-store-connect

      - name: Upload iOS build to TestFlight
        shell: bash
        run: |
          ipa_path="$(find src-tauri/gen/apple/build/arm64 -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path" || { echo "iOS IPA was not generated"; exit 1; }
          xcrun altool --upload-app --type ios --file "$ipa_path" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

      - name: Archive signed iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlashLAN-ios-${{ github.ref_name }}
          path: src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: error
